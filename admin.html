<!doctype html>
<html lang="bn">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Affiliate Link Admin — bdoffer.online</title>
<style>:root{font-family:system-ui,'Noto Sans Bengali',sans-serif;color:#10204e;background:#eef6fe}*{box-sizing:border-box}body{margin:0}.wrap{width:min(100% - 28px,1100px);margin:auto;padding:28px 0 48px}.card{background:#fff;border:1px solid #d7e6f7;border-radius:20px;padding:24px;margin:16px 0;box-shadow:0 16px 36px -26px #174c99}h1,h2{margin-top:0}.muted{color:#64769a}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}label{display:grid;gap:6px;font-weight:700}input{padding:11px;border:1px solid #b9cee7;border-radius:10px;font:inherit;min-width:0}button{border:0;border-radius:999px;padding:11px 18px;background:#0a5ee0;color:#fff;font-weight:800;cursor:pointer}button.secondary{background:#e9f1fb;color:#123a78}button.danger{background:#c6283d}button:disabled{opacity:.55;cursor:wait}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #e4edf7;padding:14px 0}.row:last-child{border-bottom:0}.url{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#52698f}.actions{display:flex;gap:8px;flex-wrap:wrap}.status{padding:10px 12px;border-radius:10px;background:#edf5ff;margin:12px 0}.error{background:#fff0f0;color:#a51c2b}.success{background:#ecfbf0;color:#16753b}.hidden{display:none!important}.hint{font-size:.9rem;color:#64769a}@media(max-width:680px){.grid{grid-template-columns:1fr}.row{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions button{flex:1}}
</style></head>
<body><main class="wrap"><header class="row" style="border:0"><div><h1>Affiliate Link Admin</h1><p class="muted">Homepage affiliate link add, update ও remove করুন।</p></div><div class="actions"><a href="/" style="padding:11px;color:#0a5ee0">সাইট দেখুন</a><button id="logout" class="secondary" hidden>Logout</button></div></header>
<section id="login-card" class="card"><h2>Admin Login</h2><form id="login-form" class="grid"><label>Username<input name="username" autocomplete="username" required></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button type="submit">Login</button></form><div id="login-status" class="status" role="status" aria-live="polite"></div></section>
<section id="dashboard" class="hidden"><div id="dashboard-status" class="status" role="status" aria-live="polite"></div><section class="card"><h2>Add affiliate link</h2><p class="hint">Key শুধু lowercase letters, numbers, hyphen বা underscore হতে পারে। URL অবশ্যই HTTPS হতে হবে।</p><form id="add-link-form" class="grid"><label>Link key<input name="linkKey" required pattern="[a-z0-9_-]{2,50}" placeholder="new_partner"></label><label>Label<input name="label" required maxlength="100" placeholder="New Partner"></label><label>Affiliate URL<input name="url" type="url" required placeholder="https://example.com/offer"></label><label>Sort order<input name="sortOrder" type="number" min="0" step="1" value="50" required></label><button type="submit">Add link</button></form></section><section class="card"><h2>Current affiliate links</h2><div id="links"></div></section></section></main><script src="/admin.js"></script></body></html>
